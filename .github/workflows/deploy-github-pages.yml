name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to publish (use the same ref for each mirror)
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Test deployment artifact transport
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_deployment_artifact.py'
          node --test --test-name-pattern='RTD restored artifacts' scripts/service-worker-cache.test.mjs

      - name: Restore the canonical deployment if already published
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/deployment-artifact.py restore --wait-seconds 0 --allow-missing || status=$?
          if [ "$status" -eq 0 ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 3 ]; then
            exit "$status"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build JupyterLite deployment
        if: steps.artifact.outputs.restored != 'true'
        run: bash ./build.sh -c

      - name: Verify deployment and record release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/deployment.json
          test -f dist/cors_server.py
          commit="$(git rev-parse HEAD)"
          test "$(jq -er '.commit' dist/deployment.json)" = "$commit"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Check the site size against the GitHub Pages limit
        shell: bash
        run: |
          set -euo pipefail
          limit=1073741824
          bytes="$(find dist -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          echo "dist is ${bytes} of ${limit} bytes"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::dist exceeds the 1 GB GitHub Pages site limit; the deployment would be rejected"
            exit 1
          fi
          if [ "$bytes" -gt $((limit / 100 * 95)) ]; then
            echo "::warning::dist uses over 95% of the 1 GB GitHub Pages limit (${bytes} bytes)"
          fi

      - name: Publish the canonical deployment for Read the Docs
        if: steps.artifact.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/datax-site.tar.gz"
          python3 scripts/deployment-artifact.py pack dist "$archive" --commit "$RELEASE_COMMIT"
          tag="site-${RELEASE_COMMIT}"
          gh release create "$tag" "$archive" \
            --target "$RELEASE_COMMIT" --draft \
            --title "JupyterLite site ${RELEASE_COMMIT}" \
            --notes "Canonical deployment shared by GitHub Pages and Read the Docs. Do not replace this artifact; publish a new commit instead."
          gh release edit "$tag" --draft=false --latest=false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report public deployment URLs
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url }}"
          page_url="${page_url%/}/"
          deployed_commit="$(curl --fail --silent --show-error "${page_url}deployment.json" | jq -er '.commit')"
          test "$deployed_commit" = "$EXPECTED_COMMIT"
          echo "JupyterLite: ${page_url}"
          {
            echo "## JupyterLite deployment"
            echo
            echo "- Release: ${deployed_commit}"
            echo "- Site: ${page_url}"
          } >> "$GITHUB_STEP_SUMMARY"
