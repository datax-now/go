name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to publish (use the same ref for each mirror)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.site.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Prepare the canonical site
        id: site
        uses: ./.github/actions/prepare-site
        with:
          github-token: ${{ github.token }}

      - name: Check the site size against the GitHub Pages limit
        shell: bash
        run: |
          set -euo pipefail
          limit=1073741824
          bytes="$(find dist -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          echo "dist is ${bytes} of ${limit} bytes"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::dist exceeds the 1 GB GitHub Pages site limit; the deployment would be rejected"
            exit 1
          fi
          if [ "$bytes" -gt $((limit / 100 * 95)) ]; then
            echo "::warning::dist uses over 95% of the 1 GB GitHub Pages limit (${bytes} bytes)"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report public deployment URLs
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.release_commit }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page_url="${PAGE_URL%/}/"
          # The CDN can serve the previous deployment for a short while after the deploy job succeeds.
          deployed_commit=""
          for attempt in $(seq 1 12); do
            deployed_commit="$(curl --fail --silent --show-error --max-time 30 "${page_url}deployment.json?verify=${GITHUB_RUN_ID}-${attempt}" | jq -er '.commit' || true)"
            [ "$deployed_commit" = "$EXPECTED_COMMIT" ] && break
            echo "Attempt ${attempt}: ${page_url} serves '${deployed_commit}', expected ${EXPECTED_COMMIT}"
            sleep 10
          done
          test "$deployed_commit" = "$EXPECTED_COMMIT"
          echo "JupyterLite: ${page_url}"
          {
            echo "## JupyterLite deployment"
            echo
            echo "- Release: ${deployed_commit}"
            echo "- Site: ${page_url}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Read the Docs cannot build a commit until its release exists. A push-triggered RTD build usually starts
  # earlier than that, so request a fresh build of `latest` once the artifact is public.
  notify-read-the-docs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Trigger the Read the Docs build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
          RTD_PROJECT: ${{ vars.RTD_PROJECT }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          set -euo pipefail
          if [ -z "${RTD_TOKEN:-}" ] || [ -z "${RTD_PROJECT:-}" ]; then
            echo "::notice::Set the RTD_TOKEN secret and RTD_PROJECT variable to start Read the Docs builds automatically."
            exit 0
          fi
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)"
          if [ "$tip" != "$RELEASE_COMMIT" ]; then
            echo "::notice::${RELEASE_COMMIT} is not the tip of ${default_branch}; Read the Docs builds only the tip."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 60 -X POST \
            -H "Authorization: Token ${RTD_TOKEN}" \
            "https://app.readthedocs.org/api/v3/projects/${RTD_PROJECT}/versions/latest/builds/" > /dev/null
          echo "Requested a Read the Docs build of latest for ${RELEASE_COMMIT}"
