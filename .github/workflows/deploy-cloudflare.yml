name: Deploy JupyterLite to Cloudflare

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to publish (use the same ref for each mirror)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: cloudflare-production
    # Publishing the commit's release (when no other host has yet) needs write access.
    permissions:
      contents: write
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s) for the cloudflare-production environment:${missing}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}

      - name: Prepare the canonical site
        id: site
        uses: ./.github/actions/prepare-site
        with:
          github-token: ${{ github.token }}

      - name: Prepare Cloudflare Pages assets
        run: |
          set -euo pipefail
          python3 scripts/prepare-cloudflare.py dist --output "$(mktemp -u "${RUNNER_TEMP}/datax-now-pages.XXXXXX")"
          echo "RELEASE_COMMIT=${{ steps.site.outputs.commit }}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.139.0 pages deploy "$PAGES_DIR" --project-name=datax-now --branch=main --commit-hash="${RELEASE_COMMIT}"; then
              exit 0
            fi
            echo "wrangler attempt ${attempt} failed" >&2
            sleep $((attempt * 20))
          done
          exit 1

      - name: Verify live Pages deployment
        run: |
          set -euo pipefail
          site_url="https://datax-now.pages.dev/"
          # Pages can take a moment to serve the new deployment on every edge location.
          deployed_commit=""
          for attempt in $(seq 1 12); do
            deployed_commit="$(curl --fail --silent --show-error --max-time 30 "${site_url}deployment.json?verify=${GITHUB_RUN_ID}-${attempt}" | jq -er '.commit' || true)"
            [ "$deployed_commit" = "$RELEASE_COMMIT" ] && break
            echo "Attempt ${attempt}: ${site_url} serves '${deployed_commit}', expected ${RELEASE_COMMIT}"
            sleep 10
          done
          test "$deployed_commit" = "$RELEASE_COMMIT"
          headers="$(curl --fail --silent --show-error --max-time 30 --head "${site_url}lab/")"
          grep -iq '^Cross-Origin-Embedder-Policy: require-corp' <<< "$headers"
          grep -iq '^Cross-Origin-Opener-Policy: same-origin' <<< "$headers"
          {
            echo "## Cloudflare deployment"
            echo
            echo "- Release: ${deployed_commit}"
            echo "- Files: ${FILE_COUNT} (Free limit: 20,000)"
            echo "- Gzip-compressed runtime assets: ${COMPRESSED_FILES}"
            echo "- Largest asset limit: 25 MiB"
            echo "- Site: ${site_url}"
          } >> "$GITHUB_STEP_SUMMARY"
