version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "26"
  jobs:
    post_install:
      - python -m pip install --upgrade pip
      - python -m pip install -r docs/requirements.txt
      - python scripts/deployment-artifact.py restore

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true

# The bundled application under _static/ holds thousands of HTML/JSON files that are not documentation.
search:
  ignore:
    - "_static/*"
    - search.html
    - search/index.html
    - 404.html
    - 404/index.html