version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "26"
  jobs:
    post_install:
      - python -m pip install --upgrade pip
      - python -m pip install -r docs/requirements.txt
      - ./build.sh -c

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true